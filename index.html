<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrikran – Ordreapp</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #e8eaed;
  --border: #d1d5db;
  --accent: #1c3461;
  --accent-hover: #162a50;
  --gold: #e8a01c;
  --green: #059669;
  --yellow: #d97706;
  --red: #dc2626;
  --orange: #ea580c;
  --text: #111827;
  --muted: #6b7280;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* LOGIN */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-card { background:var(--surface); border-radius:var(--radius); box-shadow:0 8px 32px rgba(0,0,0,.12); padding:40px 36px; width:100%; max-width:420px; text-align:center; }
.login-logo { width:52px;height:52px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;color:#fff;margin:0 auto 20px; }
.login-title { font-size:1.4rem;font-weight:700;color:var(--accent);margin-bottom:6px; }
.login-sub { font-size:.9rem;color:var(--muted);margin-bottom:28px; }
.login-input { width:100%;border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:1rem;outline:none;margin-bottom:12px;transition:border-color .15s; }
.login-input:focus { border-color:var(--accent); }
.login-btn { width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s; }
.login-btn:hover { background:var(--accent-hover); }
.login-btn:disabled { opacity:.5;cursor:not-allowed; }
.login-info { margin-top:16px;font-size:.85rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:12px; }
.login-error { margin-top:12px;font-size:.85rem;color:var(--red); }

/* HEADER */
.header { background:var(--accent);color:#fff;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2);position:sticky;top:0;z-index:100; }
.logo { display:flex;align-items:center;gap:10px; }
.logo-box { width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#fff; }
.logo-navn { font-size:1.1rem;font-weight:700;letter-spacing:.5px; }
.logo-sub { font-size:.7rem;opacity:.7;display:block; }
.header-right { display:flex;align-items:center;gap:12px; }
.bruker-epost { font-size:.8rem;opacity:.8; }
.btn-loggut { background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.85rem; }
.btn-loggut:hover { background:rgba(255,255,255,.25); }

/* TABS */
.tabs { background:var(--surface);border-bottom:1px solid var(--border);display:flex;padding:0 24px; }
.tab { padding:14px 20px;font-size:.9rem;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap; }
.tab:hover { color:var(--accent); }
.tab.active { color:var(--accent);border-bottom-color:var(--accent); }

/* MAIN */
.main { max-width:960px;margin:24px auto;padding:0 16px; }

/* BUTTONS */
.btn { padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;font-weight:600;transition:background .15s; }
.btn-primary   { background:var(--accent);color:#fff; }
.btn-primary:hover  { background:var(--accent-hover); }
.btn-secondary { background:var(--surface2);color:var(--text); }
.btn-secondary:hover { background:#d1d5db; }
.btn-gold      { background:var(--gold);color:#fff; }
.btn-gold:hover { background:#d4901a; }
.btn-danger    { background:var(--red);color:#fff; }
.btn-danger:hover { background:#b91c1c; }
.btn-sm { padding:5px 12px;font-size:.8rem; }
.btn:disabled { opacity:.5;cursor:not-allowed; }

/* SEARCH */
.search-bar { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap; }
.search-input { flex:1;min-width:180px;border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.95rem;outline:none;transition:border-color .15s; }
.search-input:focus { border-color:var(--accent); }
.select-filter { border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.9rem;outline:none;background:var(--surface);color:var(--text);cursor:pointer; }
.result-info { font-size:.85rem;color:var(--muted);margin-bottom:12px; }

/* ORDER LIST */
.order-list { display:flex;flex-direction:column;gap:10px; }
.order-card { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px;cursor:pointer;transition:box-shadow .15s,transform .1s;display:flex;justify-content:space-between;align-items:flex-start;gap:16px; }
.order-card:hover { box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-1px); }
.order-nr { font-size:1rem;font-weight:700;color:var(--accent); }
.order-kunde { font-size:.95rem;margin-top:2px; }
.order-meta { display:flex;gap:12px;margin-top:6px;flex-wrap:wrap; }
.order-meta span { font-size:.8rem;color:var(--muted); }
.order-card-right { text-align:right;flex-shrink:0; }
.order-beloep { font-size:.95rem;font-weight:600; }
.status-badge { display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600;margin-top:6px; }
.status-badge.green  { background:#d1fae5;color:#065f46; }
.status-badge.yellow { background:#fef3c7;color:#92400e; }
.status-badge.blue   { background:#dbeafe;color:#1e40af; }
.status-badge.gray   { background:#f3f4f6;color:#374151; }

/* PAGINATION */
.pagination { display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px; }
.pagination span { font-size:.9rem;color:var(--muted); }

/* LOADER */
.loader { text-align:center;padding:48px;color:var(--muted);font-size:.95rem; }
.spinner { width:36px;height:36px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* MODAL */
.modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto; }
.modal { background:var(--surface);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:720px;padding:28px;position:relative;margin:auto; }
.modal-close { position:absolute;top:16px;right:16px;background:var(--surface2);border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem; }
.modal-title { font-size:1.25rem;font-weight:700;color:var(--accent);margin-bottom:18px;padding-right:36px; }
.detail-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.detail-field label { font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:2px; }
.detail-field span { font-size:.92rem; }
.detail-full { grid-column:1/-1; }
.detail-note { background:var(--bg);border-radius:8px;padding:10px 14px;font-size:.9rem;white-space:pre-wrap; }
.section-divider { border:none;border-top:1px solid var(--border);margin:22px 0 18px; }

/* TIMER SEKSJON (modal) */
.timer-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:14px; }
.timer-heading { font-size:1rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px; }
.timer-count { background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px; }
.timer-liste { display:flex;flex-direction:column;gap:8px;margin-bottom:16px; }
.timer-rad { background:var(--bg);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px; }
.timer-rad-info { flex:1;min-width:0; }
.timer-rad-top { display:flex;gap:10px;align-items:baseline;flex-wrap:wrap; }
.timer-dato { font-size:.85rem;font-weight:600; }
.timer-antall { font-size:.85rem;font-weight:700;color:var(--accent); }
.timer-akt  { font-size:.82rem;margin-top:3px; }
.timer-komm { font-size:.8rem;color:var(--muted);margin-top:2px; }
.timer-ansatt { font-size:.75rem;color:var(--muted);margin-top:2px; }
.timer-rad-actions { display:flex;gap:6px;flex-shrink:0; }
.fakt-dot { display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;vertical-align:middle; }
.fakt-dot.ja  { background:var(--green); }
.fakt-dot.nei { background:var(--muted); }

/* TIMER FORM */
.timer-form { background:var(--bg);border-radius:10px;padding:18px;margin-top:8px; }
.timer-form h3 { font-size:.9rem;font-weight:700;color:var(--accent);margin-bottom:14px; }
.tform-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.tform-group { display:flex;flex-direction:column;gap:4px; }
.tform-group.full { grid-column:1/-1; }
.tform-group label { font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px; }
.tform-group input,.tform-group select,.tform-group textarea { border:1px solid var(--border);border-radius:7px;padding:9px 12px;font-size:.92rem;font-family:inherit;outline:none;background:var(--surface);color:var(--text);transition:border-color .15s; }
.tform-group input:focus,.tform-group select:focus,.tform-group textarea:focus { border-color:var(--accent); }
.tform-group textarea { resize:vertical;min-height:64px; }
.tform-actions { display:flex;gap:8px;justify-content:flex-end;margin-top:14px; }

/* MIN DAG */
.dag-nav { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap; }
.dag-dato-input { border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.95rem;outline:none;transition:border-color .15s; }
.dag-dato-input:focus { border-color:var(--accent); }
.dag-nav-btn { background:var(--surface2);border:none;border-radius:7px;padding:8px 12px;cursor:pointer;font-size:.9rem;transition:background .15s; }
.dag-nav-btn:hover { background:#d1d5db; }

.dag-summary { background:var(--accent);color:#fff;border-radius:var(--radius);padding:18px 24px;margin-bottom:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px; }
.dag-summary.helg { background:var(--orange); }
.dag-sum-felt .verdi { font-size:1.4rem;font-weight:700; }
.dag-sum-felt .etikett { font-size:.72rem;opacity:.8;margin-top:2px;text-transform:uppercase;letter-spacing:.5px; }
.dag-sum-helg-badge { background:rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;font-size:.78rem;font-weight:600;display:inline-block;margin-bottom:8px; }

.arbeidsdag-liste { display:flex;flex-direction:column;gap:8px;margin-bottom:16px; }
.arbeidsdag-rad { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px; }
.arbeidsdag-rad-info { flex:1; }
.arb-tid { font-size:1rem;font-weight:700;color:var(--accent); }
.arb-detalj { font-size:.82rem;color:var(--muted);margin-top:3px; }
.arb-komm { font-size:.82rem;color:var(--muted);margin-top:2px;font-style:italic; }
.arb-actions { display:flex;gap:6px;flex-shrink:0; }
.ot-badge { display:inline-block;padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:700;margin-left:8px; }
.ot-badge.ot50  { background:#fef3c7;color:#92400e; }
.ot-badge.ot100 { background:#fee2e2;color:#991b1b; }
.ot-badge.helg  { background:#fee2e2;color:#991b1b; }

/* GAP VISUALISERING */
.gap-kort { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px; }
.gap-tittel { font-size:.85rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px; }
.gap-rad { display:flex;align-items:center;gap:12px;margin-bottom:10px; }
.gap-etikett { font-size:.85rem;width:110px;flex-shrink:0; }
.gap-bar-wrap { flex:1;background:var(--surface2);border-radius:4px;height:10px;overflow:hidden; }
.gap-bar { height:100%;border-radius:4px;transition:width .4s; }
.gap-bar.ordre  { background:var(--accent); }
.gap-bar.intern { background:var(--gold); }
.gap-bar.uforklart { background:#fee2e2; }
.gap-verdi { font-size:.85rem;font-weight:600;width:48px;text-align:right;flex-shrink:0; }
.gap-status { margin-top:14px;padding:10px 14px;border-radius:8px;font-size:.88rem;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px; }
.gap-status.ok  { background:#d1fae5;color:#065f46; }
.gap-status.advarsel { background:#fef3c7;color:#92400e; }
.gap-status.mangler  { background:#fee2e2;color:#991b1b; }

/* INTERN TID */
.intern-seksjon { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:16px; }
.intern-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:14px; }
.intern-tittel { font-size:1rem;font-weight:700;color:var(--accent); }
.intern-liste { display:flex;flex-direction:column;gap:8px;margin-bottom:12px; }
.intern-rad { background:var(--bg);border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px; }
.intern-rad-info { flex:1;min-width:0; }

/* ARB FORM */
.arb-form { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px; }
.arb-form h3 { font-size:.95rem;font-weight:700;color:var(--accent);margin-bottom:14px; }
.arb-form-grid { display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px; }
.arb-form-group { display:flex;flex-direction:column;gap:4px; }
.arb-form-group.full { grid-column:1/-1; }
.arb-form-group label { font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px; }
.arb-form-group input,.arb-form-group textarea { border:1px solid var(--border);border-radius:7px;padding:9px 12px;font-size:.92rem;font-family:inherit;outline:none;background:var(--surface);color:var(--text);transition:border-color .15s; }
.arb-form-group input:focus,.arb-form-group textarea:focus { border-color:var(--accent); }
.arb-form-group textarea { resize:vertical;min-height:60px; }
.arb-netto-vis { font-size:.85rem;color:var(--accent);font-weight:600;margin-top:4px;min-height:20px; }
.arb-form-actions { display:flex;gap:8px;justify-content:flex-end;margin-top:14px; }

/* NY ORDRE */
.form-section { background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px; }
.form-section h2 { font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--border); }
.form-grid { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
.form-group { display:flex;flex-direction:column;gap:5px; }
.form-group.full { grid-column:1/-1; }
.form-group label { font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px; }
.form-group input,.form-group textarea,.form-group select { border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:.95rem;font-family:inherit;outline:none;transition:border-color .15s;background:var(--surface);color:var(--text); }
.form-group input:focus,.form-group textarea:focus,.form-group select:focus { border-color:var(--accent); }
.form-group textarea { min-height:80px;resize:vertical; }
.orderline { background:var(--bg);border-radius:8px;padding:14px;margin-bottom:10px; }
.orderline-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:12px; }
.orderline-title { font-size:.85rem;font-weight:700;color:var(--accent); }
.btn-remove { background:none;border:none;color:var(--red);cursor:pointer;font-size:1.1rem;padding:2px 6px;border-radius:4px; }
.btn-remove:hover { background:#fee2e2; }
.add-line-btn { display:flex;align-items:center;justify-content:center;gap:6px;color:var(--accent);background:none;border:2px dashed var(--border);border-radius:8px;padding:10px;width:100%;cursor:pointer;font-size:.9rem;font-weight:500;transition:all .15s; }
.add-line-btn:hover { border-color:var(--accent);background:#eef1f8; }

/* CONFIRM */
.confirm-overlay { position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px; }
.confirm-box { background:var(--surface);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.2);padding:28px;max-width:380px;width:100%;text-align:center; }
.confirm-ikon { font-size:2rem;margin-bottom:12px; }
.confirm-tittel { font-size:1.05rem;font-weight:700;margin-bottom:8px; }
.confirm-tekst { font-size:.9rem;color:var(--muted);margin-bottom:22px; }
.confirm-actions { display:flex;gap:10px;justify-content:center; }

/* TOAST */
.toast { position:fixed;bottom:24px;right:24px;background:#1f2937;color:#fff;padding:12px 20px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:999;transform:translateY(80px);opacity:0;transition:all .25s;max-width:360px; }
.toast.show { transform:translateY(0);opacity:1; }
.toast.success { background:var(--green); }
.toast.error   { background:var(--red); }
.toast.warning { background:var(--yellow); }

@media (max-width:600px) {
  .detail-grid,.form-grid,.tform-grid { grid-template-columns:1fr; }
  .form-group.full,.tform-group.full { grid-column:1; }
  .order-card { flex-direction:column; }
  .order-card-right { text-align:left; }
  .dag-summary { grid-template-columns:repeat(2,1fr); }
  .arb-form-grid { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:none;">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">IK</div>
      <div class="login-title">Industrikran Ordreapp</div>
      <div class="login-sub">Logg inn med din Industrikran-konto</div>
      <input class="login-input" id="login-epost" type="email" placeholder="navn@industrikran.no" autocomplete="email">
      <input class="login-input" id="login-passord" type="password" placeholder="Passord" autocomplete="current-password" onkeydown="if(event.key==='Enter')loggInn()">
      <button class="login-btn" id="login-btn" onclick="loggInn()">Logg inn</button>
      <div id="login-feil" class="login-error"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <header class="header">
    <div class="logo">
      <div class="logo-box">IK</div>
      <div><span class="logo-navn">Industrikran</span><span class="logo-sub">Ordreapp</span></div>
    </div>
    <div class="header-right">
      <span class="bruker-epost" id="bruker-epost"></span>
      <button class="btn-loggut" onclick="loggUt()">Logg ut</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" id="tab-sok"    onclick="byttFane('sok')">🔍 Ordresøk</div>
    <div class="tab"        id="tab-ny"     onclick="byttFane('ny')">➕ Ny ordre</div>
    <div class="tab"        id="tab-mindag" onclick="byttFane('mindag')">📅 Min dag</div>
  </div>

  <!-- ORDRESØK -->
  <div class="main" id="side-sok">
    <div class="search-bar">
      <input class="search-input" id="sokeord" type="text" placeholder="Søk på kundenavn eller ordrenummer..." onkeydown="if(event.key==='Enter')sokOrdrer()">
      <select class="select-filter" id="avdeling-filter" onchange="sokOrdrer()"><option value="">Alle avdelinger</option></select>
      <select class="select-filter" id="status-filter"   onchange="sokOrdrer()"><option value="">Alle statuser</option></select>
      <button class="btn btn-primary"   onclick="sokOrdrer()">Søk</button>
      <button class="btn btn-secondary" onclick="nullstillSok()">Nullstill</button>
    </div>
    <div id="resultat-info" class="result-info"></div>
    <div id="ordre-liste" class="order-list"><div class="loader"><div class="spinner"></div>Henter ordrer...</div></div>
    <div class="pagination" id="paginering" style="display:none;">
      <button class="btn btn-secondary" id="forrige-btn" onclick="forrigeSide()">← Forrige</button>
      <span id="side-info"></span>
      <button class="btn btn-secondary" id="neste-btn" onclick="nesteSide()">Neste →</button>
    </div>
  </div>

  <!-- NY ORDRE -->
  <div class="main" id="side-ny" style="display:none;">
    <form id="ny-ordre-form" onsubmit="sendOrdre(event)">
      <div class="form-section">
        <h2>Ordredetaljer</h2>
        <div class="form-grid">

function fmtTimer(t) {
  if (!t && t !== 0) return '–';
  t = Number(t);
  const h = Math.floor(t), m = Math.round((t - h) * 60);

  return 'gray';
}

// ── NORSKE HELLIGDAGER ────────────────────────────────────────────────────

function beregnPaaske(aar) {
  const a=aar%19,b=Math.floor(aar/100),c=aar%100,d=Math.floor(b/4),e=b%4;
  const f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(aar,month-1,day);
}
function erNorskHelligdag(d) {
  const dag=d.getDate(),mnd=d.getMonth()+1,aar=d.getFullYear();
  if(mnd===1&&dag===1)return true;
  if(mnd===5&&dag===1)return true;
  if(mnd===5&&dag===17)return true;
  if(mnd===12&&dag===25)return true;
  if(mnd===12&&dag===26)return true;
  const p=beregnPaaske(aar),ms=864e5,pMs=p.getTime();
  const dMs=new Date(aar,mnd-1,dag).getTime();
  return [-3,-2,0,1,39,49,50].some(o=>dMs===pMs+o*ms);
}
function erHelgEllerHelligdag(datoStr, fraTidStr) {
  const d=new Date(datoStr+'T12:00:00'), dagNr=d.getDay();
  if(dagNr===0||dagNr===6)return true;
  if(dagNr===5){ const h=parseInt((fraTidStr||'00:00').split(':')[0]); if(h>=21)return true; }
  if(dagNr===1){ const h=parseInt((fraTidStr||'00:00').split(':')[0]); if(h<7)return true; }
  return erNorskHelligdag(d);
}

// ── OVERTIDSBEREGNING ─────────────────────────────────────────────────────

function beregnDagTotaler(perioder) {
  const totalNetto=perioder.reduce((s,p)=>s+Number(p.netto_timer),0);
  const erHelg=perioder.some(p=>p.er_helg_helligdag);
  let ordinaer=0,ot50=0,ot100=0;
  if(erHelg){ ot100=totalNetto; }
  else if(totalNetto<=ORDINAER_TIMER){ ordinaer=totalNetto; }
  else if(totalNetto<=ORDINAER_TIMER+OT50_MAX){ ordinaer=ORDINAER_TIMER; ot50=totalNetto-ORDINAER_TIMER; }
  else { ordinaer=ORDINAER_TIMER; ot50=OT50_MAX; ot100=totalNetto-ORDINAER_TIMER-OT50_MAX; }
  return { totalNetto, ordinaer, ot50, ot100, erHelg };
}

async function hentOrdrer(side) {
  const liste=document.getElementById('ordre-liste');
  liste.innerHTML='<div class="loader"><div class="spinner"></div>Henter ordrer...</div>';
  document.getElementById('paginering').style.display='none';
  document.getElementById('resultat-info').textContent='';
  const sokeord=document.getElementById('sokeord').value.trim();
  const avdFilter=document.getElementById('avdeling-filter').value;
  const statusFilter=document.getElementById('status-filter').value;
  const fra=side*PAGE_SIZE;
  let q=sb.from('ps_ordrer').select('*',{count:'exact'})
    .eq('category_id','Ordre').order('order_number',{ascending:false})
    .range(fra,fra+PAGE_SIZE-1);
  if(sokeord){ const tall=parseInt(sokeord); q=!isNaN(tall)?q.eq('order_number',tall):q.ilike('customer_name','%'+sokeord+'%'); }
  if(avdFilter)q=q.eq('department_name',avdFilter);
  if(statusFilter)q=q.eq('status_name',statusFilter);
  const{data,error,count}=await q;
  if(error){liste.innerHTML='<div class="loader">⚠ '+error.message+'</div>';return;}
  gjeldendeSide=side;totaltAntall=count||0;
  visOrdrer(data||[]);visPaginering();
}

  const d=new Date(document.getElementById('dag-dato').value+'T12:00:00');

async function lastDag(){
  const dato=document.getElementById('dag-dato').value;
  if(!dato)return;
  const uid=await getUid();
  const[arbRes,ordreRes,internRes]=await Promise.all([
    sb.from('arbeidsdag_logg').select('*').eq('dato',dato).order('fra_tid',{ascending:true}),
    sb.from('timeregistrering').select('id,order_number,kundenavn,aktivitet_navn,timer,timeart,er_fakturerbar,kommentar')
      .eq('dato',dato).eq('ansatt_id',uid).not('order_number','is',null).order('opprettet_at',{ascending:true}),
    sb.from('timeregistrering').select('*')
      .eq('dato',dato).eq('ansatt_id',uid).is('order_number',null)
      .order('opprettet_at',{ascending:true})
  ]);
  const arb=arbRes.data||[];
  const ordre=ordreRes.data||[];
  const intern=internRes.data||[];
  visArbSummary(dato,arb);
  visArbListe(dato,arb);
  visGapVisualisering(dato,arb,ordre,intern);
  visOrdretimerDag(dato,ordre);
  visInternTidListe(dato,intern);
}

// ── MIN DAG: GAP VISUALISERING ────────────────────────────────────────────

function visGapVisualisering(dato,arbPerioder,ordretimer,internTid){
  const wrap=document.getElementById('gap-vis-wrap');
  if(!arbPerioder.length){wrap.innerHTML='';return;}
  const{totalNetto}=beregnDagTotaler(arbPerioder);
  const sumOrdre=ordretimer.reduce((s,t)=>s+Number(t.timer),0);
  const sumIntern=internTid.reduce((s,t)=>s+Number(t.timer),0);
  const sumFort=sumOrdre+sumIntern;
  const gap=Math.max(0,totalNetto-sumFort);
  const pctOrdre=Math.min(100,(sumOrdre/totalNetto)*100);
  const pctIntern=Math.min(100-pctOrdre,(sumIntern/totalNetto)*100);
  const pctGap=Math.max(0,100-pctOrdre-pctIntern);

  let statusClass='ok',statusTekst='';
  if(gap>0.25){
    statusClass='mangler';
    statusTekst=`${fmtTimer(gap)} ikke gjort rede for`;
  } else if(gap>0){
    statusClass='advarsel';
    statusTekst=`${fmtTimer(gap)} ikke gjort rede for`;
  } else {
    statusTekst='Alle timer er gjort rede for ✓';
  }

  wrap.innerHTML=`<div class="gap-kort">
    <div class="gap-tittel">Timefordeling for dagen</div>
    <div class="gap-rad">
      <span class="gap-etikett">Ordretimer</span>
      <div class="gap-bar-wrap"><div class="gap-bar ordre" style="width:${pctOrdre}%"></div></div>
      <span class="gap-verdi">${fmtTimer(sumOrdre)}</span>
    </div>
    <div class="gap-rad">
      <span class="gap-etikett">Intern tid</span>
      <div class="gap-bar-wrap"><div class="gap-bar intern" style="width:${pctIntern}%"></div></div>
      <span class="gap-verdi">${fmtTimer(sumIntern)}</span>
    </div>
    ${gap>0?`<div class="gap-rad">
      <span class="gap-etikett">Uforklart</span>
      <div class="gap-bar-wrap"><div class="gap-bar uforklart" style="width:${pctGap}%"></div></div>
      <span class="gap-verdi">${fmtTimer(gap)}</span>
    </div>`:''}
    <div class="gap-rad" style="margin-bottom:0;">
      <span class="gap-etikett" style="font-weight:600;">Arbeidstid</span>
      <div class="gap-bar-wrap"><div class="gap-bar" style="width:100%;background:var(--surface2)"></div></div>
      <span class="gap-verdi" style="font-weight:600;">${fmtTimer(totalNetto)}</span>
    </div>
    <div class="gap-status ${statusClass}">
      <span>${statusTekst}</span>
      ${gap>0.25?`<button class="btn btn-sm btn-secondary" onclick="visInternTidForm()">+ Legg til intern tid</button>`:''}
    </div>
  </div>`;
}

function oppdaterArbNetto(){
  const fra=document.getElementById('arb-fra')?.value;
  const til=document.getElementById('arb-til')?.value;
  const pause=parseInt(document.getElementById('arb-pause')?.value)||0;
  const vis=document.getElementById('arb-netto-vis');
  if(!vis)return;
  if(!fra||!til){vis.textContent='';return;}
  const[fh,fm]=fra.split(':').map(Number),[th,tm]=til.split(':').map(Number);
  const netto=(th*60+tm)-(fh*60+fm)-pause;
  if(netto<=0){vis.textContent='⚠ Til-tid må være etter fra-tid + pause';vis.style.color='var(--red)';return;}
  vis.textContent='= '+fmtTimer(netto/60)+' netto arbeidstid';
  vis.style.color='var(--accent)';
}

async function lagreArbeidsdag(){
  const dato=document.getElementById('dag-dato').value;
  const fra=document.getElementById('arb-fra').value;
  const til=document.getElementById('arb-til').value;
  const pause=parseInt(document.getElementById('arb-pause').value)||0;
  const komm=document.getElementById('arb-kommentar').value.trim();
  if(!fra||!til){toast('Fyll ut fra- og til-tid','error');return;}
  const[fh,fm]=fra.split(':').map(Number),[th,tm]=til.split(':').map(Number);
  const nettoMin=(th*60+tm)-(fh*60+fm)-pause;
  if(nettoMin<=0){toast('Netto arbeidstid må være positiv','error');return;}
  const nettoTimer=Math.round(nettoMin/60*100)/100;
  const erHelg=erHelgEllerHelligdag(dato,fra);

  // ── OVERTIDSVALIDERING (kun hverdager) ────────────────────────────────
  if(!erHelg){
    const uid=await getUid();
    let q=sb.from('arbeidsdag_logg').select('netto_timer').eq('dato',dato).eq('ansatt_id',uid);
    if(redigeringsArbId) q=q.neq('id',redigeringsArbId);
    const{data:eksist}=await q;
    const eksisterendeTotal=(eksist||[]).reduce((s,p)=>s+Number(p.netto_timer),0);
    const nyTotal=eksisterendeTotal+nettoTimer;
    // Kun block hvis det allerede finnes perioder OG ny total overstiger 7,5t uten at base er dekket
    if(eksisterendeTotal>0 && nyTotal>ORDINAER_TIMER && eksisterendeTotal<ORDINAER_TIMER){
      toast(`Kan ikke registrere overtid uten ${fmtTimer(ORDINAER_TIMER)} ordinær tid. Dagstotal så langt: ${fmtTimer(eksisterendeTotal)}`,'error');
      return;
    }
  }

  const user=await getUser();
  const rad={dato,fra_tid:fra,til_tid:til,pause_minutter:pause,
    netto_timer:nettoTimer,er_helg_helligdag:erHelg,
    ansatt_id:user.id,ansatt_epost:user.email,
    kommentar:komm||null,oppdatert_at:new Date().toISOString()};
  let error;
  if(redigeringsArbId){({error}=await sb.from('arbeidsdag_logg').update(rad).eq('id',redigeringsArbId));}
  else{({error}=await sb.from('arbeidsdag_logg').insert(rad));}
  if(error){toast('Feil: '+error.message,'error');return;}
  toast(redigeringsArbId?'Oppdatert':'Arbeidsperiode lagret ✓','success');
  skjulArbForm();await lastDag();
}

  const{data}=await sb.from('arbeidsdag_logg').select('*').eq('id',id).single();
  if(data)visArbForm(data);
}

async function forslagsArbeidsdag(){
  const dato=document.getElementById('dag-dato').value;
  const uid=await getUid();
  const{data}=await sb.from('timeregistrering').select('timer')
    .eq('dato',dato).eq('ansatt_id',uid).not('order_number','is',null);
  const sumOrdre=(data||[]).reduce((s,t)=>s+Number(t.timer),0);
  if(sumOrdre===0){toast('Ingen ordretimer registrert for denne dagen','warning');return;}
  const netto=Math.max(ORDINAER_TIMER,sumOrdre);
  const pause=30;
  const fraMin=7*60+30;
  const tilMin=fraMin+netto*60+pause;
  const tilH=Math.floor(tilMin/60),tilM=Math.round(tilMin%60);
  const til=String(tilH).padStart(2,'0')+':'+String(tilM).padStart(2,'0');
  visArbForm({fra_tid:'07:30',til_tid:til,pause_minutter:pause,kommentar:''});
  if(sumOrdre>ORDINAER_TIMER){
    toast(`Ordretimer (${fmtTimer(sumOrdre)}) overstiger normaldag. Forslag: 07:30–${til}`,'warning');
  } else {
    toast(`Forslag basert på ${fmtTimer(sumOrdre)} ordretimer → normaldag 07:30–${til}`);
  }
}

// ── SLETT (felles) ────────────────────────────────────────────────────────

function bekreftSlett(type,id){
  const titler={timer:'Slett timeregistrering',arbeidsdag:'Slett arbeidsperiode',intern:'Slett intern tid'};
  document.getElementById('confirm-tittel').textContent=titler[type]||'Er du sikker?';
  document.getElementById('confirm-tekst').textContent='Er du sikker? Dette kan ikke angres.';
  document.getElementById('confirm-overlay').style.display='flex';
  document.getElementById('bekreft-ok-btn').onclick=()=>utforSlett(type,id);
}
function lukkBekreft(){document.getElementById('confirm-overlay').style.display='none';}
async function utforSlett(type,id){
  lukkBekreft();
  let error,melding;
  if(type==='arbeidsdag'){
    ({error}=await sb.from('arbeidsdag_logg').delete().eq('id',id));
    melding='Arbeidsperiode slettet';
  } else {
    ({error}=await sb.from('timeregistrering').delete().eq('id',id));
    melding=type==='timer'?'Timeregistrering slettet':'Intern tid slettet';
  }
  if(error){toast('Feil: '+error.message,'error');return;}
  toast(melding,'success');
  if(type==='timer')await oppdaterTimerSeksjon();
  else await lastDag();
}

// ── NY ORDRE ──────────────────────────────────────────────────────────────

function leggTilOrdrelinje(){
  if(!document.getElementById('ordrelinjer'))return;
  linjeNr++;
  const div=document.createElement('div');
  div.className='orderline';div.id='linje-'+linjeNr;
  div.innerHTML=`<div class="orderline-header"><span class="orderline-title">Linje ${linjeNr}</span>
    <button type="button" class="btn-remove" onclick="fjernLinje(${linjeNr})">✕</button></div>
    <div class="form-grid">
      <div class="form-group"><label>Artikkelnr.</label><input type="text" name="l${linjeNr}_articleNumber"></div>
      <div class="form-group"><label>Antall</label><input type="number" name="l${linjeNr}_qty" value="1" min="0" step="any"></div>
      <div class="form-group"><label>Pris</label><input type="number" name="l${linjeNr}_price" placeholder="0" step="any"></div>
      <div class="form-group"><label>Rabatt %</label><input type="number" name="l${linjeNr}_discount" placeholder="0" min="0" max="100" step="any"></div>
      <div class="form-group full"><label>Beskrivelse</label><input type="text" name="l${linjeNr}_description"></div>
    </div>`;
  document.getElementById('ordrelinjer').appendChild(div);
}
function fjernLinje(nr){const el=document.getElementById('linje-'+nr);if(el)el.remove();}
function nullstillSkjema(){
  document.getElementById('ny-ordre-form').reset();
  document.getElementById('ordrelinjer').innerHTML='';
  linjeNr=0;leggTilOrdrelinje();
}
function samlLinjer(){
  return[...document.querySelectorAll('.orderline')].map(el=>{
    const id=el.id.replace('linje-','');
    const get=n=>{const f=el.querySelector(`[name="l${id}_${n}"]`);return f?f.value:'';};
    return{articleNumber:get('articleNumber'),qty:parseFloat(get('qty'))||0,
           price:parseFloat(get('price'))||0,discount:parseFloat(get('discount'))||0,
           description:get('description'),type:1};
  });
}
async function sendOrdre(e){
  e.preventDefault();
  const btn=document.getElementById('send-btn');
  btn.disabled=true;btn.textContent='Sender...';
  const lev=document.getElementById('f-deliveryDate').value;
  const payload={
    customerId:parseInt(document.getElementById('f-customerId').value)||0,
    categoryId:document.getElementById('f-categoryId').value||null,
    orderNumber:parseInt(document.getElementById('f-orderNumber').value)||0,
    deliveryDate:lev?new Date(lev).toISOString():null,
    customerReference:document.getElementById('f-customerReference').value||null,
    customerReferenceNumber:document.getElementById('f-customerReferenceNumber').value||null,
    paymentTermId:parseInt(document.getElementById('f-paymentTermId').value)||0,
    employeeResponsibleId:parseInt(document.getElementById('f-employeeResponsibleId').value)||0,
    note:document.getElementById('f-note').value||null,
    orderLines:samlLinjer()
  };
  try{
    const resp=await fetch(MAKE_WEBHOOK,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const res=await resp.json().catch(()=>({}));
    toast('Ordre opprettet!'+(res.orderNumber?' #'+res.orderNumber:''),'success');
    nullstillSkjema();byttFane('sok');hentOrdrer(0);
  }catch(err){toast('Feil: '+err.message,'error');}
  finally{btn.disabled=false;btn.textContent='Opprett ordre';}
}
</script>
