<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrikran – Ordreapp</title>
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #e8eaed;
  --border: #d1d5db;
  --accent: #1c3461;
  --accent-hover: #162a50;
  --gold: #e8a01c;
  --green: #059669;
  --yellow: #d97706;
  --red: #dc2626;
  --text: #111827;
  --muted: #6b7280;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
.header {
  background: var(--accent);
  color: #fff;
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark { width: 32px; height: 32px; object-fit: contain; filter: brightness(10); }
.logo-navn { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
.logo-sub { font-size: .7rem; opacity: .7; display: block; letter-spacing: .3px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn-icon {
  background: rgba(255,255,255,.15);
  border: none;
  color: #fff;
  width: 36px; height: 36px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.btn-icon:hover { background: rgba(255,255,255,.25); }

/* TABS */
.tabs {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  padding: 0 24px;
}
.tab {
  padding: 14px 20px;
  font-size: .9rem;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
}
.tab:hover { color: var(--accent); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* MAIN */
.main { max-width: 960px; margin: 24px auto; padding: 0 16px; }

/* SEARCH BAR */
.search-bar {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: .95rem;
  outline: none;
  transition: border-color .15s;
}
.search-input:focus { border-color: var(--accent); }
.btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: .9rem; font-weight: 600; transition: background .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--surface2); color: var(--text); }
.btn-secondary:hover { background: #d1d5db; }
.btn-gold { background: var(--gold); color: #fff; }
.btn-gold:hover { background: #d4901a; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ORDER LIST */
.order-list { display: flex; flex-direction: column; gap: 10px; }
.order-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 20px;
  cursor: pointer;
  transition: box-shadow .15s, transform .1s;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.order-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); transform: translateY(-1px); }
.order-card-left { flex: 1; min-width: 0; }
.order-nr { font-size: 1rem; font-weight: 700; color: var(--accent); }
.order-kunde { font-size: .95rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.order-meta { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; }
.order-meta span { font-size: .8rem; color: var(--muted); }
.order-card-right { text-align: right; flex-shrink: 0; }
.order-beloep { font-size: .95rem; font-weight: 600; }
.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: .75rem;
  font-weight: 600;
  margin-top: 6px;
}
.status-badge.green { background: #d1fae5; color: #065f46; }
.status-badge.yellow { background: #fef3c7; color: #92400e; }
.status-badge.blue { background: #dbeafe; color: #1e40af; }
.status-badge.gray { background: #f3f4f6; color: #374151; }

/* PAGINATION */
.pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 20px; }
.pagination span { font-size: .9rem; color: var(--muted); }

/* EMPTY / LOADER */
.loader { text-align: center; padding: 48px; color: var(--muted); font-size: .95rem; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--surface2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ORDER DETAIL MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  width: 100%;
  max-width: 680px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
  position: relative;
}
.modal-close {
  position: absolute; top: 16px; right: 16px;
  background: var(--surface2); border: none;
  width: 32px; height: 32px; border-radius: 50%;
  cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
}
.modal-title { font-size: 1.3rem; font-weight: 700; color: var(--accent); margin-bottom: 20px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.detail-field label { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 3px; }
.detail-field span { font-size: .95rem; }
.detail-full { grid-column: 1 / -1; }
.detail-note { background: var(--bg); border-radius: 8px; padding: 10px 14px; font-size: .9rem; color: var(--text); white-space: pre-wrap; }

/* CREATE FORM */
.form-section { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
.form-section h2 { font-size: 1rem; font-weight: 700; color: var(--accent); margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { font-size: .8rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.form-group input, .form-group textarea, .form-group select {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: .95rem;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
  background: var(--surface);
  color: var(--text);
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--accent); }
.form-group textarea { min-height: 80px; resize: vertical; }

/* ORDER LINES */
.orderline { background: var(--bg); border-radius: 8px; padding: 14px; margin-bottom: 10px; position: relative; }
.orderline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.orderline-title { font-size: .85rem; font-weight: 700; color: var(--accent); }
.btn-remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; }
.btn-remove:hover { background: #fee2e2; }
.add-line-btn { display: flex; align-items: center; gap: 6px; color: var(--accent); background: none; border: 2px dashed var(--border); border-radius: 8px; padding: 10px; width: 100%; cursor: pointer; font-size: .9rem; font-weight: 500; transition: all .15s; }
.add-line-btn:hover { border-color: var(--accent); background: #eef1f8; }

/* SETTINGS PANEL */
.settings-panel {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px;
  max-width: 480px;
  margin: 40px auto;
}
.settings-panel h2 { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 20px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: #1f2937;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: .9rem;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: all .25s;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

/* RESULT INFO */
.result-info { font-size: .85rem; color: var(--muted); margin-bottom: 12px; }

@media (max-width: 600px) {
  .detail-grid, .form-grid { grid-template-columns: 1fr; }
  .form-group.full { grid-column: 1; }
  .order-card { flex-direction: column; }
  .order-card-right { text-align: left; }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div style="width:32px;height:32px;background:rgba(255,255,255,.2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1rem;color:#fff;">IK</div>
    <div>
      <span class="logo-navn">Industrikran</span>
      <span class="logo-sub">Ordreapp</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="visInnstillinger()" title="Innstillinger">⚙</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-sok" onclick="byttFane('sok')">🔍 Ordresøk</div>
  <div class="tab" id="tab-ny" onclick="byttFane('ny')">➕ Ny ordre</div>
</div>

<!-- ORDRESØK -->
<div class="main" id="side-sok">
  <div class="search-bar">
    <input class="search-input" id="sokeord" type="text" placeholder="Søk på kundenavn, ordrenummer, referanse..." onkeydown="if(event.key==='Enter')sokOrdrer()">
    <button class="btn btn-primary" onclick="sokOrdrer()">Søk</button>
    <button class="btn btn-secondary" onclick="hentAlle()">Alle</button>
  </div>

  <div id="resultat-info" class="result-info"></div>
  <div id="ordre-liste" class="order-list">
    <div class="loader"><div class="spinner"></div>Henter ordrer...</div>
  </div>
  <div class="pagination" id="paginering" style="display:none;">
    <button class="btn btn-secondary" id="forrige-btn" onclick="forrigeSide()">← Forrige</button>
    <span id="side-info"></span>
    <button class="btn btn-secondary" id="neste-btn" onclick="nesteSide()">Neste →</button>
  </div>
</div>

<!-- NY ORDRE -->
<div class="main" id="side-ny" style="display:none;">
  <form id="ny-ordre-form" onsubmit="sendOrdre(event)">
    <div class="form-section">
      <h2>Ordredetaljer</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Kunde-ID *</label>
          <input type="number" id="f-customerId" placeholder="f.eks. 1042" required>
        </div>
        <div class="form-group">
          <label>Kategori-ID</label>
          <input type="text" id="f-categoryId" placeholder="f.eks. Ordre">
        </div>
        <div class="form-group">
          <label>Ordrenummer</label>
          <input type="number" id="f-orderNumber" placeholder="Genereres automatisk">
        </div>
        <div class="form-group">
          <label>Leveringsdato</label>
          <input type="date" id="f-deliveryDate">
        </div>
        <div class="form-group">
          <label>Kundereferanse</label>
          <input type="text" id="f-customerReference" placeholder="Ref. hos kunde">
        </div>
        <div class="form-group">
          <label>Kundens referansenummer</label>
          <input type="text" id="f-customerReferenceNumber" placeholder="PO-nummer e.l.">
        </div>
        <div class="form-group">
          <label>Betalingsbetingelse-ID</label>
          <input type="number" id="f-paymentTermId" placeholder="">
        </div>
        <div class="form-group">
          <label>Ansvarlig ansatt-ID</label>
          <input type="number" id="f-employeeResponsibleId" placeholder="">
        </div>
        <div class="form-group full">
          <label>Notat</label>
          <textarea id="f-note" placeholder="Intern merknad til ordren..."></textarea>
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2>Ordrelinjer</h2>
      <div id="ordrelinjer"></div>
      <button type="button" class="add-line-btn" onclick="leggTilOrdrelinje()">＋ Legg til ordrelinje</button>
    </div>

    <div style="display:flex;gap:12px;justify-content:flex-end;padding-bottom:40px;">
      <button type="button" class="btn btn-secondary" onclick="nullstillSkjema()">Nullstill</button>
      <button type="submit" class="btn btn-gold" id="send-btn">Opprett ordre</button>
    </div>
  </form>
</div>

<!-- INNSTILLINGER -->
<div class="main" id="side-innstillinger" style="display:none;">
  <div class="settings-panel">
    <h2>⚙ Innstillinger</h2>
    <div class="form-group" style="margin-bottom:16px;">
      <label>API-token (x-token)</label>
      <input type="password" id="token-input" placeholder="Lim inn token her">
    </div>
    <div class="form-group" style="margin-bottom:20px;">
      <label>API base-URL</label>
      <input type="text" id="baseurl-input" value="https://app2.prodsys.no/api">
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-primary" onclick="lagreInnstillinger()">Lagre</button>
      <button class="btn btn-secondary" onclick="skjulInnstillinger()">Avbryt</button>
    </div>
  </div>
</div>

<!-- ORDRE DETALJ MODAL -->
<div class="modal-overlay" id="detalj-modal" style="display:none;" onclick="lukkModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="lukkModal()">✕</button>
    <div id="modal-innhold"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API_BASE_KEY = 'prodsys_api_base';
const TOKEN_KEY = 'prodsys_token';
const PAGE_SIZE = 30;

let gjeldendeSide = 0;
let totaltAntall = 0;
let sisteSok = null;
let ordrelinjeNr = 0;

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function getBase() { return localStorage.getItem(API_BASE_KEY) || 'https://app2.prodsys.no/api'; }

function headers() {
  return {
    'Content-Type': 'application/json',
    'x-token': getToken()
  };
}

function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => { el.className = 'toast'; }, 3500);
}

function byttFane(fane) {
  document.getElementById('side-sok').style.display = fane === 'sok' ? '' : 'none';
  document.getElementById('side-ny').style.display = fane === 'ny' ? '' : 'none';
  document.getElementById('side-innstillinger').style.display = 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + fane).classList.add('active');
}

function visInnstillinger() {
  ['sok','ny'].forEach(f => document.getElementById('side-' + f).style.display = 'none');
  document.getElementById('side-innstillinger').style.display = '';
  document.getElementById('token-input').value = getToken();
  document.getElementById('baseurl-input').value = getBase();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
}

function skjulInnstillinger() { byttFane('sok'); }

function lagreInnstillinger() {
  localStorage.setItem(TOKEN_KEY, document.getElementById('token-input').value.trim());
  localStorage.setItem(API_BASE_KEY, document.getElementById('baseurl-input').value.trim());
  toast('Innstillinger lagret', 'success');
  byttFane('sok');
  hentOrdrer(0, null);
}

async function hentOrdrer(skip, sokeord) {
  const liste = document.getElementById('ordre-liste');
  liste.innerHTML = '<div class="loader"><div class="spinner"></div>Henter ordrer...</div>';
  document.getElementById('paginering').style.display = 'none';
  document.getElementById('resultat-info').textContent = '';

  const dxOptions = {
    requireTotalCount: true,
    skip: skip,
    take: PAGE_SIZE,
    sort: [{ selector: 'id', desc: true }],
    filter: ['CategoryID', 'Ordre'],
    totalSummary: [{ selector: 'netAmount', summaryType: 'sum' }],
    from: '2020-01-01T00:00:00',
    to: '2030-12-31T00:00:00'
  };

  if (sokeord && sokeord.trim()) {
    dxOptions.searchOperation = 'contains';
    dxOptions.searchValue = sokeord.trim();
  }

  try {
    const resp = await fetch(getBase() + '/orders/get-all', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ dxLoadOptions: dxOptions })
    });

    if (!resp.ok) throw new Error('HTTP ' + resp.status + ' – ' + (await resp.text()));
    const data = await resp.json();

    const ordrer = data.data || data;
    totaltAntall = data.totalCount || ordrer.length;
    gjeldendeSide = Math.floor(skip / PAGE_SIZE);
    sisteSok = sokeord;

    visOrdrer(ordrer);
    visPaginering();

  } catch (e) {
    liste.innerHTML = '<div class="loader">⚠ Feil: ' + e.message + '<br><small>Sjekk token og URL i innstillinger</small></div>';
  }
}

function sokOrdrer() {
  const s = document.getElementById('sokeord').value;
  hentOrdrer(0, s);
}

function hentAlle() {
  document.getElementById('sokeord').value = '';
  hentOrdrer(0, null);
}

function nesteSide() { hentOrdrer((gjeldendeSide + 1) * PAGE_SIZE, sisteSok); }
function forrigeSide() { hentOrdrer(Math.max(0, (gjeldendeSide - 1) * PAGE_SIZE), sisteSok); }

function visPaginering() {
  const totSider = Math.ceil(totaltAntall / PAGE_SIZE);
  const info = document.getElementById('resultat-info');
  info.textContent = totaltAntall + ' ordre totalt';

  if (totSider <= 1) { document.getElementById('paginering').style.display = 'none'; return; }
  document.getElementById('paginering').style.display = 'flex';
  document.getElementById('side-info').textContent = 'Side ' + (gjeldendeSide + 1) + ' av ' + totSider;
  document.getElementById('forrige-btn').disabled = gjeldendeSide === 0;
  document.getElementById('neste-btn').disabled = gjeldendeSide >= totSider - 1;
}

function statusFarge(s) {
  if (!s) return 'gray';
  const l = s.toLowerCase();
  if (l.includes('faktur')) return 'green';
  if (l.includes('klar') || l.includes('ferdig')) return 'green';
  if (l.includes('produksjon') || l.includes('aktiv')) return 'blue';
  if (l.includes('vent') || l.includes('tilbud')) return 'yellow';
  return 'gray';
}

function fmtBeloep(v) {
  if (v == null) return '–';
  return Number(v).toLocaleString('nb-NO', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' kr';
}

function fmtDato(d) {
  if (!d) return '–';
  return new Date(d).toLocaleDateString('nb-NO');
}

function visOrdrer(ordrer) {
  const liste = document.getElementById('ordre-liste');
  if (!ordrer || ordrer.length === 0) {
    liste.innerHTML = '<div class="loader">Ingen ordrer funnet.</div>';
    return;
  }
  liste.innerHTML = ordrer.map(o => `
    <div class="order-card" onclick="visDetalj(${JSON.stringify(JSON.stringify(o))})">
      <div class="order-card-left">
        <div class="order-nr">#${o.orderNumber || o.id}</div>
        <div class="order-kunde">${o.customerName || '–'}</div>
        <div class="order-meta">
          <span>📅 Levering: ${fmtDato(o.deliveryDate)}</span>
          ${o.departmentName ? `<span>🏢 ${o.departmentName}</span>` : ''}
          ${o.customerReference ? `<span>📋 ${o.customerReference}</span>` : ''}
        </div>
      </div>
      <div class="order-card-right">
        <div class="order-beloep">${fmtBeloep(o.netAmount)}</div>
        <span class="status-badge ${statusFarge(o.statusName)}">${o.statusName || 'Ukjent'}</span>
      </div>
    </div>
  `).join('');
}

function visDetalj(jsonStr) {
  const o = JSON.parse(jsonStr);
  const modal = document.getElementById('detalj-modal');
  document.getElementById('modal-innhold').innerHTML = `
    <div class="modal-title">#${o.orderNumber || o.id} – ${o.customerName || '–'}</div>
    <div class="detail-grid">
      <div class="detail-field">
        <label>Status</label>
        <span class="status-badge ${statusFarge(o.statusName)}">${o.statusName || '–'}</span>
      </div>
      <div class="detail-field">
        <label>Avdeling</label>
        <span>${o.departmentName || '–'}</span>
      </div>
      <div class="detail-field">
        <label>Leveringsdato</label>
        <span>${fmtDato(o.deliveryDate)}</span>
      </div>
      <div class="detail-field">
        <label>Ordredato</label>
        <span>${fmtDato(o.date)}</span>
      </div>
      <div class="detail-field">
        <label>Netto beløp</label>
        <span>${fmtBeloep(o.netAmount)}</span>
      </div>
      <div class="detail-field">
        <label>Kundenr.</label>
        <span>${o.customerNumber || '–'}</span>
      </div>
      <div class="detail-field">
        <label>Kundereferanse</label>
        <span>${o.customerReference || '–'}</span>
      </div>
      <div class="detail-field">
        <label>Ref.nummer</label>
        <span>${o.customerReferenceNumber || '–'}</span>
      </div>
      ${o.siteAddressAddress ? `
      <div class="detail-field detail-full">
        <label>Leveringsadresse</label>
        <span>${o.siteAddressAddress || ''}, ${o.siteAddressPostCode || ''} ${o.siteAddressCity || ''}</span>
      </div>` : ''}
      ${o.projectDescription ? `
      <div class="detail-field detail-full">
        <label>Prosjekt</label>
        <span>${o.projectDescription}</span>
      </div>` : ''}
      ${o.note ? `
      <div class="detail-field detail-full">
        <label>Notat</label>
        <div class="detail-note">${o.note}</div>
      </div>` : ''}
      <div class="detail-field">
        <label>Opprettet av</label>
        <span>${o.userName || '–'}</span>
      </div>
      <div class="detail-field">
        <label>Opprettet dato</label>
        <span>${fmtDato(o.dateCreated)}</span>
      </div>
    </div>
  `;
  modal.style.display = 'flex';
}

function lukkModal(e) {
  if (!e || e.target === document.getElementById('detalj-modal') || !e.target) {
    document.getElementById('detalj-modal').style.display = 'none';
  }
}

// ── NY ORDRE ──────────────────────────────────────────────────────────────

let linjeNr = 0;

function leggTilOrdrelinje() {
  linjeNr++;
  const container = document.getElementById('ordrelinjer');
  const div = document.createElement('div');
  div.className = 'orderline';
  div.id = 'linje-' + linjeNr;
  div.innerHTML = `
    <div class="orderline-header">
      <span class="orderline-title">Linje ${linjeNr}</span>
      <button type="button" class="btn-remove" onclick="fjernLinje(${linjeNr})">✕</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Artikkelnr.</label>
        <input type="text" name="l${linjeNr}_articleNumber" placeholder="Art.nr.">
      </div>
      <div class="form-group">
        <label>Antall</label>
        <input type="number" name="l${linjeNr}_qty" placeholder="1" value="1" min="0" step="any">
      </div>
      <div class="form-group">
        <label>Pris</label>
        <input type="number" name="l${linjeNr}_price" placeholder="0" step="any">
      </div>
      <div class="form-group">
        <label>Rabatt %</label>
        <input type="number" name="l${linjeNr}_discount" placeholder="0" min="0" max="100" step="any">
      </div>
      <div class="form-group full">
        <label>Beskrivelse</label>
        <input type="text" name="l${linjeNr}_description" placeholder="Beskrivelse av vare/tjeneste">
      </div>
    </div>
  `;
  container.appendChild(div);
}

function fjernLinje(nr) {
  const el = document.getElementById('linje-' + nr);
  if (el) el.remove();
}

function nullstillSkjema() {
  document.getElementById('ny-ordre-form').reset();
  document.getElementById('ordrelinjer').innerHTML = '';
  linjeNr = 0;
}

function samlLinjer() {
  const linjer = [];
  document.querySelectorAll('.orderline').forEach(el => {
    const id = el.id.replace('linje-', '');
    const get = name => {
      const f = el.querySelector('[name="l' + id + '_' + name + '"]');
      return f ? f.value : '';
    };
    linjer.push({
      articleNumber: get('articleNumber'),
      qty: parseFloat(get('qty')) || 0,
      price: parseFloat(get('price')) || 0,
      discount: parseFloat(get('discount')) || 0,
      description: get('description'),
      type: 1
    });
  });
  return linjer;
}

async function sendOrdre(e) {
  e.preventDefault();
  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  btn.textContent = 'Sender...';

  const leveringsDato = document.getElementById('f-deliveryDate').value;

  const payload = {
    customerId: parseInt(document.getElementById('f-customerId').value) || 0,
    categoryId: document.getElementById('f-categoryId').value || null,
    orderNumber: parseInt(document.getElementById('f-orderNumber').value) || 0,
    deliveryDate: leveringsDato ? new Date(leveringsDato).toISOString() : null,
    customerReference: document.getElementById('f-customerReference').value || null,
    customerReferenceNumber: document.getElementById('f-customerReferenceNumber').value || null,
    paymentTermId: parseInt(document.getElementById('f-paymentTermId').value) || 0,
    employeeResponsibleId: parseInt(document.getElementById('f-employeeResponsibleId').value) || 0,
    note: document.getElementById('f-note').value || null,
    orderLines: samlLinjer()
  };

  try {
    const resp = await fetch(getBase() + '/orders', {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify(payload)
    });

    if (!resp.ok) {
      const tekst = await resp.text();
      throw new Error('HTTP ' + resp.status + ': ' + tekst);
    }

    const resultat = await resp.json();
    toast('Ordre opprettet! #' + (resultat.orderNumber || resultat.id || ''), 'success');
    nullstillSkjema();
    byttFane('sok');
    hentOrdrer(0, null);

  } catch (err) {
    toast('Feil: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Opprett ordre';
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────

window.addEventListener('load', () => {
  if (!getToken()) {
    visInnstillinger();
    toast('Legg inn API-token for å komme i gang');
  } else {
    hentOrdrer(0, null);
  }
  leggTilOrdrelinje();
});
</script>
